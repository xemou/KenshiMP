# KenshiMP settings. Your own copy lives in %LOCALAPPDATA%\kenshi\KenshiMP\kenshimp.cfg (created from this one the first time).
# Everybody must run the same KenshiMP version and the same mod list (same order).

# mode: off | host | join
mode=off
# used when mode=join: IP or hostname of the host
address=127.0.0.1
# TCP port (the host must open/forward it, or use a VPN like ZeroTier/Tailscale/Radmin)
port=47000
# optional: host and clients must use the same password (empty = anyone may join)
password=
name=Player
faction=My Faction

# starting relation with the other players: -100 = war, 0 = neutral, 100 = allies
# in game: F9 = declare war, F10 = make peace (only while the game window has focus)
relation=0

# ghost_ai: none = other players' characters only follow the network (recommended)
#           full = they also run the vanilla AI (may wander / act on their own)
ghost_ai=none

sync_appearance=1
sync_equipment=1
sync_buildings=1

# npc_sync=1: the host's world (NPCs, animals) is shared; a client's own world population is
# switched off while connected. 0 = everybody keeps their own NPCs (not shared).
npc_sync=1

# pause_sync=1: only the host can pause, and his pause applies to everybody
pause_sync=1

# strict_mods=1: the host refuses players whose mod list differs (0 = only a warning)
strict_mods=1

# auto_reconnect=1: a client retries every 10 s after losing the connection
auto_reconnect=1

# debug_keys=1 enables F11 = place a test building next to the selected character,
#                      F8  = jump the local clock 3 h ahead
debug_keys=0

# Tip: play in borderless window mode (launcher: "Sans bordure"). Exclusive fullscreen
# minimises on alt-tab, which pauses the game and freezes your squad for the others.

# render_smoothing=1: draw other players on their smoothed path (render layer)
render_smoothing=1

# weather_sync=1: the host's weather (sandstorms, acid rain, fog...) applies to everybody
weather_sync=1

# town_sync=1: the host's world states (unique NPCs killed or jailed) apply to everybody, and so do
# the town changes they cause (towns destroyed, abandoned or taken by another faction). A changed town
# shows its new version the next time its area loads, as in the base game. Town doors broken (or repaired)
# and town buildings destroyed by any player are also the same for everybody.
town_sync=1

# lobby_key: key of the multiplayer window (F1..F12). Also a MULTIPLAYER button on the title screen.
# Host / Join / Leave from that window rewrite mode, address, port, name, faction and password here.
lobby_key=F4

# language: auto (same as the game: settings.cfg), fr or en
language=auto

# show_players_on_map=1: other players' squads appear on the world map (not while at war with them)
show_players_on_map=1

# ghost_no_collide=1 (experimental, off by default): other players' characters are not pushed aside by
# your characters' bodies (fewer catch-up jumps in a crowd). Not yet tried in game.
ghost_no_collide=0

# load_sharing=1 (host only, experimental, off by default): a player far from the host (over 3000 units)
# simulates the world around himself on his own PC; the host stops simulating that region (less CPU
# for the host). Back within 2000 units, the host takes over again (one shared world).
load_sharing=0

# assault_hostility=1 (off by default): like Kenshi's own factions, a player whose characters hurt yours
# while you are not at war loses standing with you (-25 per assault); below zero it is war.
assault_hostility=0
